# Kalibrasi kamera untuk ORB-SLAM3
# Resolusi: 640x480
# Reprojection error: 0.1551 px
# Valid frames: 40

%YAML:1.0

# ─── Camera Parameters ────────────────────────────────────────
Camera.type: "PinHole"

Camera.fx: 158.182930
Camera.fy: 158.450768
Camera.cx: 313.472305
Camera.cy: 251.655932

# Distortion parameters (k1, k2, p1, p2, k3)
Camera.k1: -0.24560604
Camera.k2: 0.06302814
Camera.p1: 0.00020750
Camera.p2: -0.00231109
Camera.k3: -0.00717532

Camera.width:  640
Camera.height: 480

# Frames per second — sesuaikan dengan kamera kamu
Camera.fps: 30

# 1: monocular, 3: RGB-D
Camera.RGB: 1

# ─── ORB Parameters ───────────────────────────────────────────
ORBextractor.nFeatures:  1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels:    8
ORBextractor.iniThFAST:  20
ORBextractor.minThFAST:  7

# ─── Viewer Parameters ────────────────────────────────────────
Viewer.KeyFrameSize:      0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth:    0.9
Viewer.PointSize:         2
Viewer.CameraSize:        0.08
Viewer.CameraLineWidth:   3
Viewer.ViewpointX:        0
Viewer.ViewpointY:        -0.7
Viewer.ViewpointZ:        -1.8
Viewer.ViewpointF:        500
